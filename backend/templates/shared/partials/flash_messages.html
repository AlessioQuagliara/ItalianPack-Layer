{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div id="flash_container" class="mb-4 flex flex-col gap-2">
    {% for category, message in messages %}
    <div role="alert"
         class="alert {% if category == 'error' %}alert-error{% else %}alert-success{% endif %} flash-msg
                flex items-center gap-2">
      <i class="{% if category == 'error' %}ri-error-warning-line{% else %}ri-check-line{% endif %} text-lg shrink-0"></i>
      <span class="flex-1">{{ message }}</span>
      <button type="button" class="btn btn-xs btn-ghost shrink-0"
              onclick="this.closest('.flash-msg').remove()">
        <i class="ri-close-line"></i>
      </button>
    </div>
    {% endfor %}
  </div>
  <script>
  (function () {
    setTimeout(function () {
      document.querySelectorAll('.flash-msg').forEach(function (el) {
        el.style.transition = 'opacity 0.4s ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 400);
      });
    }, 4000);
  }());
  </script>
  {% endif %}
{% endwith %}
