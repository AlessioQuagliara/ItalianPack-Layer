<script>
  (function () {
    const STORAGE_KEY = "theme";
    const DEFAULT_THEME = "light";
    const root = document.documentElement;
    const radios = document.querySelectorAll('input[name="theme-radios"]');
    const themeName = document.getElementById("theme-name");
    const themeBadge = document.getElementById("theme-badge");

    const allowedThemes = Array.from(radios).map(radio => radio.value);
    const savedTheme = localStorage.getItem(STORAGE_KEY);
    const activeTheme = allowedThemes.includes(savedTheme) ? savedTheme : DEFAULT_THEME;

    root.setAttribute("data-theme", activeTheme);

    radios.forEach((radio) => {
      radio.checked = radio.value === activeTheme;

      radio.addEventListener("change", () => {
        if (!radio.checked) return;

        const selectedTheme = radio.value;
        root.setAttribute("data-theme", selectedTheme);
        localStorage.setItem(STORAGE_KEY, selectedTheme);

        if (themeName) themeName.textContent = selectedTheme;
        if (themeBadge) themeBadge.textContent = selectedTheme;
      });
    });

    if (themeName) themeName.textContent = activeTheme;
    if (themeBadge) themeBadge.textContent = activeTheme;
  })();
</script>
