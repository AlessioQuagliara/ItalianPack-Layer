<!-- templates/landing/base.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{title}}{% endblock %} - Admin</title>
    <!-- UIkit CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    {% include "landing/partials/navbar.html" %}

    <!-- Container della griglia: 1 colonna su mobile, 3 colonne da 'sm' in su -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center p-4">
        
        <!-- Prima Card -->
        <div>
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
                {% block header %}{% endblock %}
            </div>
        </div>

        <!-- Seconda Card -->
        <div>
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
                {% block content %}{% endblock %}
            </div>
        </div>

        <!-- Terza Card -->
        <div>
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
                Item
            </div>
        </div>

    </div>
</body>
</html>
