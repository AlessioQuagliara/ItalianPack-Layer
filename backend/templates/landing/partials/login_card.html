<!-- templates/landing/partials/login_card.html -->
<div class="p-6 bg-white rounded-lg">
    <h3 class="text-2xl font-semibold mb-4 text-gray-800">Login</h3>

    <form action="login" method="post" class="space-y-4">

        {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <p class="text-sm">{{ error }}</p>
            </div>
        {% endif %}

        <div>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                   name="username" 
                   type="text" 
                   placeholder="Username" 
                   aria-label="Username">
        </div>

        <div>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                   name="password" 
                   type="password" 
                   placeholder="Password" 
                   aria-label="Password">
        </div>

        <button class="w-full bg-white hover:bg-gray-50 text-gray-800 font-medium py-2 px-4 border border-gray-300 rounded shadow-sm transition-colors">
            Accedi
        </button>

    </form>
</div>
