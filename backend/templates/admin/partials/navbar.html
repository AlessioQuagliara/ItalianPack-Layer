
    <nav class="navbar w-full bg-base-300">

      <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
        <!-- Sidebar toggle icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
      </label>

      <div class="px-4">{{title}}</div>

      {% if role in ['magazzino', 'admin'] %}
      <form method="GET" action="{{ url_for('shared.search') }}"
            class="flex items-center gap-1 mx-4">
        <input type="hidden" name="role" value="{{ role }}">
        <div class="relative">
          <i class="ri-search-line absolute left-2 top-1/2 -translate-y-1/2 text-base-content/40 text-sm pointer-events-none"></i>
          <input name="commessa"
                 placeholder="Cerca commessa…"
                 class="input input-sm input-bordered pl-7 w-44 font-mono uppercase"
                 pattern="[A-Z]{2,4}\s[0-9]{6}"
                 title="Formato: EX 000345"
                 autocomplete="off" />
        </div>
      </form>
      {% endif %}

      <span class="countdown font-mono text-2xl ml-auto">
        <span style="--value:0;" id="hours" aria-live="polite" aria-label="0">00</span>
        :
        <span style="--value:0;" id="minutes" aria-live="polite" aria-label="0">00</span>
        :
        <span style="--value:0;" id="seconds" aria-live="polite" aria-label="0">00</span>
      </span>

    </nav>
